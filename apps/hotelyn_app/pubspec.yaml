name: hotelyn
description: "Hotelyn Flutter mobile app"

version: 1.0.0+1
publish_to: 'none'

resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  bloc: ^9.2.0
  california_ui:
    path: ../../packages/california_ui
  clarity_flutter: ^1.10.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  font_awesome_flutter: ">=10.12.0 <12.0.0"
  formz: ^0.8.1
  go_router: ^18.0.1
  hotelyn_api_client:
    path: ../../packages/hotelyn_api_client
  hotelyn_domain:
    path: ../../packages/hotelyn_domain
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.8.0
  shared_preferences: ^2.5.4
  uuid: ^4.5.1

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.11.2
  melos: ^7.3.0
  mocktail: ^1.0.4
  riverpod_lint: ^3.1.0
  # Pinned to the version bundled with the Flutter SDK (test_api 0.7.12); see #225.
  test: ^1.25.0
  very_good_analysis: ^11.0.0

fonts:
  - family: DMSans
    fonts:
      - asset: assets/fonts/DMSans_18pt-Regular.ttf
        style: regular
      - asset: assets/fonts/DMSans_18pt-Medium.ttf
        style: medium
      - asset: assets/fonts/DMSans_18pt-Bold.ttf
        style: bold

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/images/hotelyn/
    - assets/images/intro/
    - assets/images/messages/
    - assets/icons/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_18pt-Regular.ttf
        - asset: assets/fonts/DMSans_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_18pt-Bold.ttf
          weight: 700
